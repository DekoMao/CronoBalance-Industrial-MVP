name: Build and deploy CronoBalance PWA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cb_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend
      - name: Run API acceptance suite
        run: python -m pytest -q
        working-directory: backend
      - name: Verify migrations and acceptance on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/cb_test
          CB_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/cb_test
        run: |
          alembic upgrade head
          python -m pytest -q
  verify-sync:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cb_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/cb_test
      AUTO_CREATE_SCHEMA: "false"
      APP_ENV: development
      DEV_AUTH_TOKEN: workflow-local-test
      VITE_DEV_AUTH_TOKEN: workflow-local-test
      VITE_API_BASE_URL: http://127.0.0.1:8000
      CORS_ORIGINS: http://127.0.0.1:4179
      CB_CLOUD_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start API against PostgreSQL
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          alembic upgrade head
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health/ready && exit 0; sleep 1; done
          exit 1
      - name: Synchronize two offline browsers and apply a server proposal
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
          npm test
      - name: Show API diagnostics
        if: failure()
        run: tail -60 "$RUNNER_TEMP/api.log"
  build:
    needs: [verify-api, verify-sync]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --no-audit --no-fund
      - name: Build application
        run: npm run build --prefix frontend
        env:
          VITE_BASE_PATH: /CronoBalance-Industrial-MVP/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_AUTHORITY: ${{ vars.VITE_OIDC_AUTHORITY }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_ORGANIZATION_ID: ${{ vars.VITE_ORGANIZATION_ID }}
      - name: Verify the published build in Chromium
        working-directory: frontend
        env:
          VITE_BASE_PATH: /CronoBalance-Industrial-MVP/
        run: |
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacao-industrial
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
      - name: Add Pages metadata
        run: touch frontend/dist/.nojekyll && cp frontend/dist/index.html frontend/dist/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
