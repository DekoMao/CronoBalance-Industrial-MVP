services:
  cronobalance:
    build: .
    image: cronobalance-industrial:0.1
    container_name: cronobalance-industrial
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
